<VirtualHost *:443>
    ServerName cat.gospeltranslations.ai
    DocumentRoot /home/matecat/matecat
    DirectoryIndex index.php index.html

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/cat.gospeltranslations.ai/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cat.gospeltranslations.ai/privkey.pem

    SSLProxyEngine On

    <Directory /home/matecat/matecat/>
        Options All
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/matecat/error.log
    CustomLog ${APACHE_LOG_DIR}/matecat/access.log combined
    ServerSignature Off

    RewriteEngine On
    
    # Redirigir WebSockets al puerto 7788
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/sse/(.*)           ws://127.0.0.1:7788/$1 [P,L]

    <Location /sse/>
        ProxyPass http://127.0.0.1:7788/
        ProxyPassReverse http://127.0.0.1:7788/
    </Location>
</VirtualHost>
